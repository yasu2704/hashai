[package]
name = "hashai"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Generate shell commands from natural language using Codex CLI"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.4"
tempfile = "3.23.0"
