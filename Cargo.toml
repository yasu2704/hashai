[package]
name = "hashai"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Generate shell commands from natural language using Codex CLI"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.23.0"
toml = "0.9.8"
ctrlc = "3.5.1"
libc = "0.2.178"
fs2 = "0.4.3"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.4"
