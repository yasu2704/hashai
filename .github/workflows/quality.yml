name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bash-readline:
    name: Bash Readline integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install supported Bash and ShellCheck
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            if ! command -v shellcheck >/dev/null 2>&1; then
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes shellcheck
            fi
            command -v bash
            command -v shellcheck
            shellcheck --version
            echo "BASH_BIN=$(command -v bash)" >> "$GITHUB_ENV"
          else
            brew install bash shellcheck
            echo "BASH_BIN=$(brew --prefix bash)/bin/bash" >> "$GITHUB_ENV"
          fi
      - run: $BASH_BIN -c 'test "${BASH_VERSINFO[0]}" -gt 5 || { test "${BASH_VERSINFO[0]}" -eq 5 && test "${BASH_VERSINFO[1]}" -ge 2; }'
      - run: cargo build
      - run: $BASH_BIN -n shell/hashai.bash tests/bash_readline_integration.sh
      - run: shellcheck -x -P tests shell/hashai.bash tests/bash_readline_integration.sh
      - run: HASHAI_BIN=target/debug/hashai HASHAI_BASH_BIN=$BASH_BIN $BASH_BIN tests/bash_readline_integration.sh
      - name: Bash 4 syntax contract
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run --rm -v "$PWD:/src:ro" bash:4.4 bash -n /src/shell/hashai.bash
          docker run --rm -v "$PWD:/src:ro" bash:4.4 bash -c 'source /src/shell/hashai.bash; declare -F __hashai_bash_replace_line'

  zsh-zle:
    name: Zsh ZLE integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install supported Zsh
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            if ! command -v zsh >/dev/null 2>&1; then
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes zsh
            fi
            command -v zsh
            zsh --version
            echo "ZSH_BIN=$(command -v zsh)" >> "$GITHUB_ENV"
          else
            echo "ZSH_BIN=$(command -v zsh)" >> "$GITHUB_ENV"
          fi
      - run: $ZSH_BIN -fc 'autoload -Uz is-at-least; is-at-least 5.8'
      - run: cargo build
      - run: $ZSH_BIN -n shell/hashai.zsh
      - run: HASHAI_ZSH_BIN=$ZSH_BIN python3 -m unittest tests/zsh_zle_pty_test.py
      - run: HASHAI_BIN=target/debug/hashai HASHAI_ZSH_BIN=$ZSH_BIN bash tests/zsh_zle_integration.sh

  fish-commandline:
    name: Fish commandline integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install supported Fish
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            if ! command -v fish >/dev/null 2>&1; then sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes fish; fi
            fish_bin=$(command -v fish)
          else
            brew install fish
            fish_bin=$(brew --prefix fish)/bin/fish
          fi
          test -x "$fish_bin"
          "$fish_bin" --version
          echo "FISH_BIN=$fish_bin" >> "$GITHUB_ENV"
      - run: $FISH_BIN --version | grep -Eq 'fish, version ([4-9]|3\.[6-9])'
      - run: cargo build
      - run: $FISH_BIN -n shell/hashai.fish
      - run: HASHAI_FISH_BIN=$FISH_BIN python3 -m unittest tests/fish_pty_test.py
      - run: HASHAI_BIN=target/debug/hashai HASHAI_FISH_BIN=$FISH_BIN bash tests/fish_commandline_integration.sh

  quality:
    name: ${{ matrix.os }} quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo build --all-targets --all-features
